name: CI

on:
  push:
    branches: [main, dev]
    # Editing prose that no gate reads should not start a three-system build.
    # Deliberately a short list rather than `**.md`: the doc-drift, CLI-docs
    # and surface-snapshot gates all compare generated markdown against the
    # code, so most .md files ARE checked and must not be skipped.
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# A new push to the same branch makes an in-flight run obsolete. Cancelling it
# keeps the queue short without affecting correctness.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Secret scanning ──────────────────────────────────────────────────────
  # Runs independently of the build: a leaked credential is worth knowing
  # about even when compilation is broken. A vault key was committed here
  # once, so this is a real regression guard rather than box-ticking.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks scans the pushed commit range, which a shallow clone
          # cannot see.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build, lint, typecheck, test ─────────────────────────────────────────
  # The matrix exists because the desktop app ships on all three platforms
  # and the codebase does real path, PTY and native-module work. Linux-only
  # CI cannot catch Windows path handling.
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung job otherwise runs until the six-hour default before failing,
    # which hides the real problem and blocks anything queued behind it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux only on a pull request, so you get an answer in about twenty
        # minutes while the change is still in your head. The full sweep runs
        # on merge to main/dev, which is once per change rather than once per
        # push. Public repositories get unlimited free runner time, so this is
        # about how long you wait, not what it costs.
        #
        # `macos-26` is pinned rather than `macos-latest`: that label moved to
        # a new macOS release in June 2026 and will move again, which would
        # silently change what the Mac leg is actually testing.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-26"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build

      # `pnpm lint` (not `pnpm turbo lint`) — the root script is
      # `turbo lint && check:security && check:tokens`. CI called the turbo
      # task directly, which runs each package's own `eslint src/` and skips
      # the two composite steps entirely, so `check-security-invariants.mjs`
      # (8 rules) and `check-no-app-wide-cdp.mjs` had never once run in CI
      # despite being written specifically to be CI guards.
      - run: pnpm lint

      # Web design-system ratchet. Counts raw <button>/<select>/Loader2 uses
      # against a committed baseline and fails when the count goes UP. The
      # baseline file and its shrink-only rules are owned by the web UI
      # overhaul (WS-F2) in apps/web/scripts/check-design-system.mjs — this
      # step only wires it into CI. Ubuntu-only: it reads source, not builds.
      - name: Check web design-system ratchet
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @generatorai/web check:design

      - run: pnpm turbo typecheck

      - run: pnpm turbo test

      # WEB-03: enforce 800 KB gzipped budget on the web bundle.
      # `pnpm turbo build` above already produced dist/ — this just checks it.
      # Bundle size does not vary by platform, so once is enough.
      - name: Check web bundle size
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @generatorai/web check:bundle

      # CLI_TUI_POST_OVERHAUL_PARITY_AUDIT_2026.md §5.6 — the CLI's declared
      # `bin` was never actually produced or exercised by CI: `pnpm turbo
      # build` above only emits `dist/`, and release automation packages the
      # desktop app, never this. Bundle it, pack it exactly the way `npm
      # install` would consume it, install that tarball into a directory
      # with no workspace symlinks, and run the resulting binary — the same
      # sequence that caught (a) two native deps missing from `dependencies`
      # entirely and (b) `files` shipping the whole `src/` tree while
      # omitting the actual `bin` target, both fixed in the same change that
      # added this job. All three platforms: ConPTY/pathing differences are
      # exactly what a Linux-only check would miss.
      # ── Parity audit Phase 0 items 2/3 ────────────────────────────────
      #
      # Three drift checks, all of the same shape: an artifact that is
      # DERIVED from the code and committed, regenerated here and diffed. The
      # failure they exist to catch is documentation and parity claims that
      # quietly stop matching the code — which is what the whole audit was
      # written in response to.
      #
      # Ubuntu-only: generation reads the registry and writes markdown, and
      # neither varies by platform. The bin-build check below is the one that
      # genuinely needs all three.
      - name: Check generated docs and the surface snapshot for drift
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter @generatorai/cli docs:check
          pnpm --filter @generatorai/cli surface:check

      # Clean-generation: regenerating from scratch must produce byte-identical
      # output. A generator that is not idempotent makes every diff noisy and
      # trains reviewers to ignore it — and hides a real change among the
      # churn.
      - name: Check generated output is idempotent
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter @generatorai/cli docs
          pnpm --filter @generatorai/cli surface
          git diff --exit-code -- .github/docs/usage-cli.md docs/CLI_SURFACE_SNAPSHOT.md

      # W45 — protocol schemas are generated from a pinned upstream artifact
      # and diffed here, so an upstream schema change surfaces as a failing
      # diff rather than a runtime decode error.
      #
      # The deliberate shape is "delete, regenerate, diff". A plain
      # `generate && git diff --exit-code` passes vacuously when the generator
      # emits nothing — which is exactly what the previous generator did: it
      # rewrote one `// Schema version:` comment and left the "generated" types
      # hand-written, so this gate would have stayed green through any amount
      # of upstream drift. Deleting the outputs first means a generator that
      # writes nothing leaves a deletion in the working tree and fails the
      # diff. The gate cannot certify nothing.
      #
      # Ubuntu-only, like the docs-drift checks above: the generator reads JSON
      # and writes LF-terminated TypeScript, neither of which varies by
      # platform, and a Windows checkout's CRLF translation would make the
      # diff noisy for no signal.
      - name: Check generated protocol schemas for drift
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          protocol_dir=packages/agent-harness-providers/src/protocol
          # Every protocol is generated now — ACP from the pinned SDK's own
          # schema, Codex and OpenCode from the artifacts committed under
          # schemas/. There are no hand-written stand-ins left to preserve.
          generated=(
            "$protocol_dir/acp.generated.ts"
            "$protocol_dir/codex.generated.ts"
            "$protocol_dir/opencode.generated.ts"
          )

          rm -f "${generated[@]}"
          # No --allow-missing: with every protocol pinned, a non-zero exit here
          # is a real regression rather than a known gap. (The generator's
          # refuse-loudly path is covered by generate-schemas.test.ts, which
          # drives runGenerator against a fixture manifest — it does not need a
          # synthetic failure staged here.)
          pnpm generate:schemas

          for f in "${generated[@]}"; do
            test -s "$f" || { echo "::error::generator did not write $f"; exit 1; }
            grep -q '^// Artifact sha256: [0-9a-f]\{64\}$' "$f" \
              || { echo "::error::$f carries no upstream artifact hash — it was not derived from a pinned artifact"; exit 1; }
          done

          # The real gate: regenerated output must match what is committed, and
          # the artifacts it was derived from must be unchanged.
          git diff --exit-code -- "$protocol_dir" schemas/

          # No protocol may quietly regress to a hand-written stand-in. That is
          # how the previous state arose: two files labelled "generated from
          # upstream spec. Do not hand-edit" describing vocabularies neither
          # upstream binary has ever spoken, with a diff gate that stayed green
          # because nothing generated them.
          unpinned=$(node -e "const m=require('./schemas/versions.json').protocols;console.log(Object.values(m).filter(p=>p.status!=='generated').length)")
          if [ "$unpinned" != "0" ]; then
            echo "::error::schemas/versions.json declares $unpinned protocol(s) without a pinned upstream artifact. Every protocol must be generated from one."
            exit 1
          fi
          if compgen -G "$protocol_dir/*.handwritten.ts" > /dev/null; then
            echo "::error::a hand-written protocol stand-in reappeared in $protocol_dir"
            exit 1
          fi

      # Targeted coverage. `packages/cli-core/vitest.config.ts` carries per-area
      # thresholds for the four areas the audit names by name — command
      # contracts, input routing, pane state and timeline reduction — set at
      # what the suite achieves today, so this fails only when behaviour lands
      # with no test behind it.
      - name: Coverage report (command contracts, input routing, pane state)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @generatorai/cli-core exec vitest run --coverage

      - name: Bundle and smoke-test the packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @generatorai/cli run bundle
          pnpm --filter @generatorai/cli pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/generatorai-cli-*.tgz)
          install_dir="$RUNNER_TEMP/cli-install-smoke"
          rm -rf "$install_dir" && mkdir -p "$install_dir"
          cd "$install_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "$tgz"
          bin="node_modules/@generatorai/cli/dist-bundle/generatorai.mjs"
          test -f "$bin" || { echo "::error::packed tarball is missing dist-bundle/generatorai.mjs"; exit 1; }
          version_out=$(node "$bin" --version)
          echo "version: $version_out"
          node "$bin" system doctor
          # `system doctor` is requiresServer:false and reports one failing
          # check ("connection: none configured") by design in a fresh
          # environment — a nonzero exit here would mean the binary itself
          # failed to run, not that it found something to warn about.

  # ── §1.Q concurrent-load test ────────────────────────────────────────────
  # ARCHITECTURE_V2_MASTER_PLAN_FINAL.md §11.3's own "single most important
  # addition in Phase 7": nothing else in the suite exercises concurrency,
  # memory, or clean-shutdown/orphan-process behaviour together against a
  # real booted server. Deliberately its own job, separate from
  # `build-and-test`: it boots a whole extra server process and a headless
  # Chromium, needs `playwright install`, and is new enough (unlike the
  # unit/integration suite above) that a flake here should be visible without
  # blocking every other PR — hence `continue-on-error`. Ubuntu-only: the
  # assertions (latency, memory, zero orphans) are not platform-specific
  # claims the way the CLI smoke test's ConPTY/pathing checks are, and one
  # platform is enough to keep it fast.
  concurrent-load-test:
    name: Concurrent-load test (§1.Q)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # `playwright` is a dependency of @generatorai/core (ServerPlaywrightHost),
      # not of @generatorai/server directly — install browsers from there so
      # pnpm's strict node_modules actually resolves the `playwright` binary.
      - run: pnpm --filter @generatorai/core exec playwright install --with-deps chromium

      # The test boots the real production artifact — the esbuild bundle,
      # not `tsc`'s `dist/` (see the comment at the top of
      # `bootServerPortable` in the script itself for why) — build it first.
      - run: pnpm --filter @generatorai/server bundle

      - run: node agent-tests/concurrent-load-1q.mjs

  # ── Web UI end-to-end suite (review item 15) ─────────────────────────────
  # `agent-tests/e2e/*.spec.ts` drives the real web app against a real server.
  # Until this job existed the suite never ran in CI at all: the load-test job
  # above installed Playwright's browsers and then executed only a plain Node
  # script. This boots the same production bundle that job uses (see
  # `bootServerPortable` in agent-tests/concurrent-load-1q.mjs for why the
  # bundle and not `tsc`'s dist/), with the loopback dev-auth escape hatch
  # the suite's REST seeding helpers assume, plus the Vite dev server on
  # :5173 proxying /api to :3100 — exactly the topology the config file
  # documents (`requires web :5173 + server :3100`). Retries are set to 1 by
  # playwright.config.ts whenever CI is set. This is a real gate, not
  # continue-on-error: a failing e2e is a failing PR.
  e2e:
    name: Web UI e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      SERVER_PORT: '3100'
      WEB_PORT: '5173'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Browsers come from @generatorai/core's playwright dependency (see the
      # load-test job); the e2e runner itself is agent-tests' @playwright/test,
      # which shares the same browser cache directory.
      - run: pnpm --filter @generatorai/core exec playwright install --with-deps chromium

      - run: pnpm --filter @generatorai/server bundle

      - name: Start server and web dev server
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/e2e-state"
          mkdir -p "$state/artifacts" "$state/logs"
          echo "E2E_STATE=$state" >> "$GITHUB_ENV"

          # Server: same env shape as agent-tests/concurrent-load-1q.mjs.
          (
            cd apps/server
            PORT="$SERVER_PORT" \
            WIDGET_PORT="$((SERVER_PORT + 1))" \
            GENERATORAI_DB_PATH="$state/e2e.db" \
            GENERATORAI_ARTIFACTS_DIR="$state/artifacts" \
            GENERATORAI_ALLOW_UNAUTHENTICATED_LOOPBACK=1 \
            NODE_ENV=test \
            nohup node dist-bundle/server.mjs > "$state/logs/server.log" 2>&1 &
            echo $! > "$state/server.pid"
          )

          # Web: Vite dev server, proxying /api and the WS routes to :3100
          # (apps/web/vite.config.ts).
          (
            cd apps/web
            nohup pnpm exec vite --port "$WEB_PORT" --host 127.0.0.1 --strictPort \
              > "$state/logs/web.log" 2>&1 &
            echo $! > "$state/web.pid"
          )

          wait_for() {
            local url=$1 name=$2 deadline=$((SECONDS + 120))
            until curl -fsS -o /dev/null "$url"; do
              if (( SECONDS >= deadline )); then
                echo "::error::$name did not become healthy within 120s ($url)"
                tail -n 100 "$state/logs/server.log" "$state/logs/web.log" || true
                exit 1
              fi
              sleep 1
            done
            echo "$name is up: $url"
          }
          wait_for "http://127.0.0.1:$SERVER_PORT/api/health" server
          wait_for "http://127.0.0.1:$WEB_PORT/" web

      - name: Run Playwright e2e suite
        shell: bash
        env:
          TARGET_URL: http://localhost:5173
          API_URL: http://localhost:3100/api
        run: |
          set -euo pipefail
          pnpm --filter @generatorai/agent-tests test:e2e

      - name: Stop server and web dev server
        if: always()
        shell: bash
        run: |
          for f in "$E2E_STATE/server.pid" "$E2E_STATE/web.pid"; do
            if [ -f "$f" ]; then
              pid=$(cat "$f")
              kill -TERM "$pid" 2>/dev/null || true
            fi
          done
          # Give the server its graceful-shutdown window before the runner
          # tears the job down, so the log captures the shutdown path too.
          sleep 5

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: agent-tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server and web logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-server-logs
          path: ${{ env.E2E_STATE }}/logs/
          if-no-files-found: ignore
          retention-days: 14

  # ── Phone bundle hygiene ─────────────────────────────────────────────────
  # The phone app's unit tests and lint already run inside the turbo sweep
  # above, but the two checks that matter for SHIPPING it did not run
  # anywhere: a production bundle build, and the gate that fails when
  # server-side code ends up on the phone.
  #
  # That is not a hypothetical risk here — a server package leaking into the
  # phone bundle has happened before, and `scripts/check-bundle.mjs` was
  # written in response. Until now nothing ran it.
  mobile-bundle:
    name: Phone bundle hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Only what the phone actually depends on — building the server and
      # desktop trees here would cost minutes for no signal.
      - run: pnpm turbo build --filter=@generatorai/mobile^...

      # Exports a real production bundle and reads its source map, so this
      # also proves the app still bundles at all.
      - name: Bundle hygiene gate
        working-directory: apps/mobile
        run: pnpm run bundle:check

  # ── Server container ─────────────────────────────────────────────────────
  # Builds the image the release publishes, and does NOT push it. The
  # Dockerfile, `.dockerignore` and the runtime-staging script were all
  # written against each other but nothing ever built them together, so a
  # break in any of the three would first have been discovered during a
  # release. Catching it on a pull request instead costs one Linux job.
  container:
    name: Server container builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Plain Docker rather than the docker/* actions: it is preinstalled, and
      # nothing here needs a registry, a cache backend or multi-platform
      # emulation.
      - name: Build the image
        run: docker build -f docker/server.Dockerfile -t generatorai/server:ci .

      # An image that builds but cannot start is not much of a check. This
      # boots it against a throwaway volume and waits for the health endpoint
      # the image's own HEALTHCHECK uses.
      - name: Boot it and wait for health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name gai-ci -p 3100:3100 \
            -e GENERATORAI_SECRET_KEY="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" \
            generatorai/server:ci
          deadline=$((SECONDS + 120))
          until curl -fsS -o /dev/null http://127.0.0.1:3100/api/health; do
            if ! docker ps --format '{{.Names}}' | grep -q '^gai-ci$'; then
              echo "::error::the container exited before becoming healthy"
              docker logs gai-ci || true
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::container did not become healthy within 120s"
              docker logs gai-ci || true
              exit 1
            fi
            sleep 2
          done
          echo "container is healthy"

      - name: Stop it
        if: always()
        run: docker rm -f gai-ci 2>/dev/null || true
