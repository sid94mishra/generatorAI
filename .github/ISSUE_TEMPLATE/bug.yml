name: Bug report
description: Something is broken. Please include the version and which client.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        GeneratorAI is alpha software with four clients across five operating systems.
        "It doesn't work" is not actionable — the fields below are the ones that
        actually narrow it down.

        **Security problems do not belong here.** Report those privately: see SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown by `generatorai --version`, or Settings › About in the app.
      placeholder: 0.1.0-alpha.1
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Which client
      options:
        - Desktop app
        - Web UI (in a browser)
        - Command-line tool
        - Phone app (Android)
        - Server only (no client involved)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system running the SERVER
      description: The machine your code and agents live on, not the one you are looking at.
      options:
        - Windows
        - macOS (Apple Silicon)
        - Linux
        - In a container
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Desktop installer
        - Container image
        - npm (command-line tool)
        - Android APK download
        - Built from source
    validations:
      required: true

  - type: input
    id: harness
    attributes:
      label: Which agent harness
      description: Claude Agent SDK, GitHub Copilot CLI, or not relevant.
      placeholder: claude-agent

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error text
      description: >
        Server logs, or the error as shown. Please check it for API keys, tokens
        and file paths you would rather not publish before pasting.
      render: text
