<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notes Canvas</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        color: inherit;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid #d0d7de;
      }
      header h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      header .grow {
        flex: 1;
      }
      header button {
        border: 1px solid #d0d7de;
        background: #fff;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      textarea {
        flex: 1;
        border: none;
        outline: none;
        resize: none;
        padding: 12px 14px;
        font-family: 'SF Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.55;
        background: transparent;
        color: inherit;
      }
      footer {
        padding: 6px 14px;
        font-size: 11px;
        color: #6e7681;
        border-top: 1px solid #d0d7de;
      }
      @media (prefers-color-scheme: dark) {
        header,
        footer {
          border-color: #30363d;
        }
        header button {
          background: #0d1117;
          border-color: #30363d;
          color: #e6edf3;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h2 id="title">Notes</h2>
      <div class="grow"></div>
      <span id="chars" style="font-size:11px;color:#6e7681"></span>
      <button id="clear">Clear</button>
      <button id="share">Share with agent</button>
    </header>
    <textarea id="content" placeholder="Write markdown here…"></textarea>
    <footer>Auto-saves. Click "Share" to send the current text to the agent as a widget action.</footer>
    <script>
      const contentEl = document.getElementById('content');
      const charsEl = document.getElementById('chars');
      const titleEl = document.getElementById('title');
      const clearBtn = document.getElementById('clear');
      const shareBtn = document.getElementById('share');
      let debounce = 0;

      function updateChars() {
        charsEl.textContent = `${contentEl.value.length} chars`;
      }

      contentEl.addEventListener('input', () => {
        updateChars();
        clearTimeout(debounce);
        debounce = setTimeout(() => {
          window.parent.postMessage(
            {
              type: 'widget:state',
              state: { text: contentEl.value },
            },
            '*',
          );
        }, 250);
      });

      clearBtn.addEventListener('click', () => {
        contentEl.value = '';
        updateChars();
        window.parent.postMessage(
          { type: 'widget:state', state: { text: '' } },
          '*',
        );
        window.parent.postMessage(
          { type: 'widget:action', action: 'clear' },
          '*',
        );
      });

      shareBtn.addEventListener('click', () => {
        window.parent.postMessage(
          {
            type: 'widget:action',
            action: 'share',
            payload: { text: contentEl.value },
          },
          '*',
        );
      });

      window.addEventListener('message', (ev) => {
        const m = ev.data;
        if (!m || typeof m !== 'object') return;
        if (m.type === 'widget:init' || m.type === 'widget:state') {
          const state = m.state ?? {};
          if (typeof state.text === 'string' && state.text !== contentEl.value) {
            contentEl.value = state.text;
            updateChars();
          }
          if (m.type === 'widget:init' && m.props) {
            if (typeof m.props.title === 'string') titleEl.textContent = m.props.title;
          }
        }
      });

      window.parent.postMessage({ type: 'widget:hello' }, '*');
      requestAnimationFrame(() =>
        window.parent.postMessage({ type: 'widget:ready' }, '*'),
      );
      updateChars();
    </script>
  </body>
</html>
