# ────────────────────────────────────────────────────────────────
# GeneratorAI — Observability Stack (100% free / open-source)
#
# Usage:
#   cd docker/observability
#   docker compose up -d
#
# Components:
#   - OTel Collector  (receives OTLP, fans out to backends)
#   - Jaeger           (distributed tracing UI)       → http://localhost:16686
#   - Prometheus        (metrics)                      → http://localhost:9090
#   - Loki             (log aggregation)               → http://localhost:3101
#   - Grafana          (dashboards & data source hub)  → http://localhost:3000
# ────────────────────────────────────────────────────────────────

services:
  # ── OpenTelemetry Collector ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
    depends_on:
      - jaeger
      - loki

  # ── Jaeger — distributed tracing ──
  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Collector HTTP
      - "14250:14250" # Collector gRPC

  # ── Prometheus — metrics ──
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  # ── Loki — log aggregation ──
  loki:
    image: grafana/loki:3.1.0
    ports:
      - "3101:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # ── Grafana — dashboards ──
  grafana:
    image: grafana/grafana-oss:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  prometheus-data:
  grafana-data:
