# ────────────────────────────────────────────────────────────────
# GeneratorAI — Observability Stack (100% free / open-source)
#
# Usage:
#   cd docker/observability
#   GRAFANA_ADMIN_PASSWORD='<choose one>' docker compose up -d
#
# Components (ALL bound to 127.0.0.1 — reachable from this host only):
#   - OTel Collector  (receives OTLP, fans out to backends)
#   - Jaeger           (distributed tracing UI)       → http://127.0.0.1:16686
#   - Prometheus        (metrics)                      → http://127.0.0.1:9090
#   - Loki             (log aggregation)               → http://127.0.0.1:3101
#   - Grafana          (dashboards & data source hub)  → http://127.0.0.1:3000
#
# Security (APPLICATION-REVIEW-2026-09 §6.7): this file used to publish every
# port on 0.0.0.0 with Grafana's anonymous access set to Admin and the admin
# password hard-coded to `admin` — anyone on the network had full control of
# the dashboards and every data source behind them. Now:
#   * every `ports:` entry is prefixed `127.0.0.1:`; use an SSH tunnel or a
#     TLS-terminating proxy in front of Grafana to reach it remotely;
#   * anonymous access is off;
#   * the admin password MUST come from `GRAFANA_ADMIN_PASSWORD` — compose
#     refuses to start without it (the `:?` form below), so there is no
#     default to forget to change.
# Prometheus, Loki and Jaeger have no auth of their own; loopback binding is
# what protects them. Do not remove the prefix to "make it work" from another
# machine — front them with a proxy that authenticates instead.
# ────────────────────────────────────────────────────────────────

services:
  # ── OpenTelemetry Collector ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:8888:8888"   # Collector metrics
    depends_on:
      - jaeger
      - loki

  # ── Jaeger — distributed tracing ──
  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:14268:14268" # Collector HTTP
      - "127.0.0.1:14250:14250" # Collector gRPC

  # ── Prometheus — metrics ──
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  # ── Loki — log aggregation ──
  loki:
    image: grafana/loki:3.1.0
    ports:
      - "127.0.0.1:3101:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # ── Grafana — dashboards ──
  grafana:
    image: grafana/grafana-oss:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # No default on purpose. `docker compose up` fails fast with the message
      # after `:?` until the operator picks a password.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD to a strong password before starting Grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  prometheus-data:
  grafana-data:
