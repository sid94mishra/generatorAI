# ────────────────────────────────────────────────────────────────
# OpenTelemetry Collector Configuration
# Receives OTLP from GeneratorAI server, fans out to backends.
# ────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Add resource attributes for all telemetry
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  # Traces → Jaeger
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  # Metrics → Prometheus (pull-based)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: generatorai

  # Logs → Loki
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"

  # Debug output (stdout) — useful during development
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [loki, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: "0.0.0.0:8888"
