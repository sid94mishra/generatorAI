# ────────────────────────────────────────────────────────────────
# Reference edge configuration — W09.
#
# This file is the whole of P2-12's fix. The browser's six-connection limit is
# an HTTP/1.1 property, and connection management in HTTP is hop-by-hop
# (RFC 8441 §1: "it does not offer compatibility at the connection-management
# level"). The browser negotiates streams with THIS server, not with the Node
# process behind it, so terminating HTTP/2 here removes the limit entirely
# regardless of what we speak upstream.
#
# That is why Express's well-known inability to use Node's `http2` module never
# mattered: we never needed it. One directive at the edge, and a tab can hold
# far more concurrent streams than it will ever open.
#
# Nothing below is optional. Each directive exists because a specific default
# breaks streaming, and the failure mode is recorded next to it.
#
# ── Certificates ────────────────────────────────────────────────────────────
# The 443 block below will not start until `ssl_certificate` and
# `ssl_certificate_key` point at real files. Two ways to get them:
#
#   Let's Encrypt (public hostname):
#     certbot certonly --nginx -d generatorai.example.com
#     → /etc/letsencrypt/live/generatorai.example.com/{fullchain,privkey}.pem
#
#   Self-signed (LAN / lab; every paired client must trust it):
#     openssl req -x509 -newkey rsa:4096 -sha256 -days 365 -nodes \
#       -keyout /etc/ssl/private/generatorai.key \
#       -out    /etc/ssl/certs/generatorai.crt \
#       -subj "/CN=generatorai.local" \
#       -addext "subjectAltName=DNS:generatorai.local,IP:192.168.1.10"
#
# ── Client address ──────────────────────────────────────────────────────────
# `X-Forwarded-For` is set to `$remote_addr` — the TCP peer nginx actually
# sees — and NOT `$proxy_add_x_forwarded_for`. The latter APPENDS to whatever
# the client sent, so a remote client could put `127.0.0.1` at the front of the
# list and the app's loopback check (`apps/server/src/middleware/auth.ts`,
# `isLoopbackRequest`) would believe it. The app trusts exactly one hop; this
# file is that hop, and it must overwrite, never append.
#
# If nginx itself sits behind another proxy you control (a cloud load balancer,
# Cloudflare), let the `real_ip` module recover the client address ONLY from
# that trusted range — see the commented block in the 443 server.
# ────────────────────────────────────────────────────────────────

upstream generatorai {
    # The app's default `PORT` is 3100 (`apps/server/src/index.ts`).
    server 127.0.0.1:3100;
    # Long-lived connections to the app. Without this, nginx opens and closes a
    # TCP connection per request, and the handshake cost lands on every REST
    # call made alongside an open stream.
    keepalive 64;
}

# ── Plain HTTP: redirect only ────────────────────────────────────────────────
# Credentials are DPoP-bound access tokens and pairing grants; none of them may
# ever travel in the clear. Nothing is proxied on :80.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # THE directive. Default `http2_max_concurrent_streams` is 128; browsers
    # default to 100. Both are far above the ~5 streams a busy tab holds.
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/certs/generatorai.crt;
    ssl_certificate_key /etc/ssl/private/generatorai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Trusted upstream proxy (OPTIONAL) ─────────────────────────────────
    # Uncomment ONLY when nginx is itself behind a proxy you control. Every
    # address listed here is allowed to tell nginx who the real client is;
    # anything else is treated as the client it is.
    #
    # set_real_ip_from 10.0.0.0/8;          # e.g. your VPC load balancer range
    # set_real_ip_from 2400:cb00::/32;      # e.g. Cloudflare (keep the list current)
    # real_ip_header   X-Forwarded-For;
    # real_ip_recursive on;

    # Response headers the app also sets itself (`apps/server/src/middleware`),
    # repeated at the edge so an nginx-level error page carries them too.
    # `always` — nginx drops `add_header` on non-2xx/3xx responses otherwise.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Server-Sent Events ──────────────────────────────────────────────
    #
    # Everything here is about NOT helping. nginx's defaults are tuned for
    # finite responses and every one of them is wrong for a stream.
    location /api/stream {
        proxy_pass http://generatorai;
        proxy_http_version 1.1;

        # Without this nginx accumulates the response and forwards it in
        # chunks, so tokens arrive in bursts seconds apart and the stream looks
        # frozen. The app also sends `X-Accel-Buffering: no` as a second line of
        # defence; this is the first.
        proxy_buffering off;
        proxy_cache off;

        # Default is 60s, and an idle agent (a long tool call, a model thinking)
        # trivially exceeds it. The app heartbeats every 15s, so 3600 here is a
        # backstop rather than the mechanism.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # `Connection: ""` clears the hop-by-hop header so the upstream
        # keepalive above is actually used.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket: terminal bytes, browser frames, speech audio ─────────
    #
    # These carry binary. SSE is UTF-8 only by spec, and the decode algorithm
    # silently replaces invalid bytes with U+FFFD — so raw PTY output on SSE
    # would not merely cost +33% in base64, it would be CORRUPTED. This is why
    # every web terminal on earth uses WebSocket binary frames, and why the
    # channel split is correct rather than a workaround.
    location ~ ^/(terminal|browser|stt)-ws {
        proxy_pass http://generatorai;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Everything else ─────────────────────────────────────────────────
    location / {
        proxy_pass http://generatorai;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ────────────────────────────────────────────────────────────────
# Sizing note.
#
# With nginx terminating HTTP/2 the BROWSER uses one connection, but nginx still
# opens one upstream socket per SSE stream. Size `worker_connections` and the
# Node process's file-descriptor limit against total concurrent STREAMS, not
# against connected clients.
#
# Other infrastructure, if you are behind it:
#   - AWS ALB idle timeout defaults to 60s and explicitly does NOT reset on an
#     HTTP/2 PING. The 15s application heartbeat covers this.
#   - Cloudflare's origin read timeout is 125s. Also covered.
#   - HAProxy governs SSE by `timeout server` (typically 25-50s) because SSE
#     never upgrades, while WebSocket gets `timeout tunnel` (recommended 1h).
#     Behind HAProxy, raise `timeout server` on the streaming backend or SSE
#     dies in under a minute while WebSocket survives an hour.
#   - Cloudflare Argo is incompatible with WebSocket.
# ────────────────────────────────────────────────────────────────
