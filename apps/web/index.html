<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeneratorAI</title>

  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <!-- Prevent theme flash: apply the stored mode class, palette and accent
         BEFORE React renders. Keep in sync with providers/ThemeProvider.tsx.

         Deliberately inline and dependency-free: this has to run before the
         first paint, and anything that needs a module fetch is by definition
         too late. -->
    <script>
      (function() {
        var mode, theme, accent;
        try {
          mode = localStorage.getItem('generatorai-theme') || 'dark';
          theme = localStorage.getItem('generatorai-theme-palette') || 'github';
          accent = localStorage.getItem('generatorai-accent') || 'blue';
        } catch (e) {
          mode = 'dark';
          theme = 'github';
          accent = 'blue';
        }
        var resolved = mode === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        var root = document.documentElement;
        root.classList.add(resolved);
        root.setAttribute('data-mode', mode);
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-accent', accent);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
