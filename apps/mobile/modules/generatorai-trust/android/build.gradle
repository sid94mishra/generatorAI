plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.generatorai'
version = '0.1.0'

android {
  namespace "dev.generatorai.trust"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // OkHttpClientProvider (React Native networking, WebSocket, expo/fetch) and OkHttp itself, which react-android
  // exposes as an api dependency: no new library reaches the APK.
  implementation 'com.facebook.react:react-android'
}
