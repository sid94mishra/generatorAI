appId: ${APP_ID}
name: search · palette opens destinations, actions and entities
# MB-21 / MD-81. Keyboard selection (↑ ↓ ↵ Esc) runs through the hardware-key host (M5-09): checked on a tablet.
tags: [smoke, search]
env: {FRESH_CHAT: stream}
---
- runFlow: ../_subflows/launch.yaml
- runFlow: ../_subflows/open-sidebar.yaml
- tapOn: {id: drawer-search}
- extendedWaitUntil: {visible: {id: search-palette}, timeout: 15000}
# With Recent above them the groups can sit under the keyboard: scroll to them.
- scrollUntilVisible: {element: {id: search-group-actions}, direction: DOWN, timeout: 10000}
- scrollUntilVisible: {element: {id: search-group-nav}, direction: DOWN, timeout: 10000}
- tapOn: {id: search-input}
- inputText: chats
- extendedWaitUntil: {visible: {id: "search-row-nav:chats"}, timeout: 15000}
- tapOn: {id: "search-row-nav:chats"}
- extendedWaitUntil: {visible: {id: chats-new}, timeout: 15000}
# Recents remember the destination.
- openLink: generatorai:///search
- extendedWaitUntil: {visible: {id: search-group-recent}, timeout: 15000}
- tapOn: {id: search-close}
- extendedWaitUntil: {notVisible: {id: search-palette}, timeout: 10000}
