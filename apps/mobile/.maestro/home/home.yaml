appId: ${APP_ID}
name: home · counts, sections, week strip and server footer
# M7-01 (MHome, MHomeMore). Count tiles scroll to their sections; the footer opens the server switcher.
tags: [smoke, home]
---
- runFlow: ../_subflows/launch.yaml
- extendedWaitUntil: {visible: {id: home-counts}, timeout: 30000}
# A count tile reads "<n>, <label>" as one element.
- assertVisible: ".*Need you"
- assertVisible: ".*Finished today"
- assertVisible: {id: home-needs}
- tapOn: ".*Finished today"
- extendedWaitUntil: {visible: {id: home-recent}, timeout: 10000}
- scrollUntilVisible: {element: {id: home-server}, direction: DOWN, timeout: 20000}
- assertVisible: "This week"
- tapOn: {id: home-server}
- extendedWaitUntil: {visible: "Servers.*", timeout: 15000}
