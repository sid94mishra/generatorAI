appId: ${APP_ID}
name: chat · send, stream and approve gate
tags: [characterization, smoke]
env: {FRESH_CHAT: gate}
---
- runFlow: ../_subflows/launch.yaml
- openLink: generatorai:///chats/${CHAT_GATE_ID}
- extendedWaitUntil: {visible: {id: composer-input}, timeout: 30000}
- runFlow: ../_subflows/pane-closed.yaml
- tapOn: {id: composer-input}
- inputText: Please run the tests
- runFlow:
    when: {platform: Android}
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil: {visible: {id: composer-send}, timeout: 10000}
- tapOn: {id: composer-send}
- extendedWaitUntil: {visible: {id: gate-card}, timeout: 30000}
- assertVisible: ".*Run pnpm test.*"
- assertVisible: {id: composer-input, enabled: true}
- tapOn: {id: composer-input}
- inputText: Pending approval draft
- runFlow:
    when: {platform: Android}
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- assertVisible: Pending approval draft
- tapOn: {id: composer-input}
- eraseText
- runFlow:
    when: {platform: Android}
    commands:
      - hideKeyboard
- waitForAnimationToEnd
# M6-03: the fixture's shell gate is risky (MG-04), so Allow once signs with the approval key (MD-31). On a fresh
# simulator / emulator the card first offers "Register approval key"; each step shows the system biometric prompt,
# which the runner must match outside Maestro (iOS: `xcrun simctl` Face ID enrol + match; Android: `adb emu finger
# touch 1`). See 08-verification and the M6 batch notes.
- runFlow:
    when: {visible: {id: gate-permission-register}}
    commands:
      - tapOn: {id: gate-permission-register}
      - extendedWaitUntil: {visible: {id: gate-permission-allow_once}, timeout: 60000}
- tapOn: {id: gate-permission-allow_once}
- extendedWaitUntil: {visible: ".*Thanks — running it now.*", timeout: 30000}
- extendedWaitUntil: {visible: "Dictate a message", timeout: 30000}
- assertNotVisible: {id: gate-card}
- assertNotVisible: {id: composer-stop}
