appId: ${APP_ID}
name: chat · send and stream
# The current empty composer displays Dictate, not Send (MD-103).
tags: [characterization, smoke]
env: {FRESH_CHAT: stream}
---
- runFlow: ../_subflows/launch.yaml
- openLink: generatorai:///chats/${CHAT_STREAM_ID}
- extendedWaitUntil: {visible: {id: composer-input}, timeout: 30000}
- tapOn: {id: composer-input}
- inputText: Show the mobile markdown streaming fixture
- runFlow:
    when: {platform: Android}
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil: {visible: {id: composer-send}, timeout: 10000}
- tapOn: {id: composer-send}
- extendedWaitUntil: {visible: ".*The stream is complete.*", timeout: 60000}
- assertVisible: ".*Mobile streaming check.*"
- assertVisible: ".*export function total.*"
- assertVisible: {id: transcript-list}
- assertNotVisible: {id: composer-stop}
- assertNotVisible: {id: composer-force-reset}
- assertVisible: Dictate a message
