appId: ${APP_ID}
name: workflows · list, detail, runs, graph, new draft
# M8-01 (MWorkflows, MWorkflowDetail(+More), MWorkflowNew(+Basics)). Replaces the "workflow" phase of the
# web-preview e2e/audit-scenarios.mjs (08 §6.3). The sandbox seeds "Sandbox Workflow"; the draft needs write:workflows.
tags: [workflows]
---
- runFlow: ../_subflows/launch.yaml
- openLink: generatorai:///workflows
- extendedWaitUntil: {visible: {id: workflows}, timeout: 20000}
- extendedWaitUntil: {visible: "Sandbox Workflow", timeout: 15000}
- tapOn: "Sandbox Workflow"
- extendedWaitUntil: {visible: {id: workflow-detail}, timeout: 15000}
- assertVisible: {id: workflow-version}
- assertVisible: "Recent runs"
- assertVisible: "Setup"
- tapOn: {id: workflow-mini-graph}
- extendedWaitUntil: {visible: {id: workflow-graph-canvas}, timeout: 10000}
- tapOn: {id: graph-fit}
- tapOn: {id: graph-list}
- extendedWaitUntil: {visible: {id: workflow-detail}, timeout: 10000}
- openLink: generatorai:///workflows/new
- extendedWaitUntil: {visible: {id: workflow-new}, timeout: 15000}
- tapOn: {id: workflow-new-blank}
- tapOn: {id: workflow-new-name}
- inputText: Maestro draft
- tapOn: "Create"
- extendedWaitUntil: {visible: {id: workflow-detail}, timeout: 20000}
- assertVisible: "Draft"
- tapOn: {id: workflow-more}
- tapOn: "Delete workflow"
- tapOn: {text: "Delete workflow", index: 1}
- extendedWaitUntil: {visible: {id: workflows}, timeout: 15000}
