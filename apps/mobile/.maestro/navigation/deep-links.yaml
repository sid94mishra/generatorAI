- extendedWaitUntil: {visible: {id: home-new-chat}, timeout: 30000}
- assertNotVisible: {id: composer-input}
- openLink: generatorai:///chats/%2e%2e/settings
- extendedWaitUntil: {visible: {id: home-new-chat}, timeout: 30000}
- assertNotVisible: {id: composer-input}
# M5 route tree (04 §1.6, MD-145): legacy roots are rejected; mobile-only screens open.
