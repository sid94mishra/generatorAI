appId: ${APP_ID}
name: settings · root, search, general default model, providers, skills, MCP add, templates
# M7-05 (MSettings, MSettingsMore, MSetGeneral, MSetProviders, MSetSkills, MSetMcp, MSetMcpAdd, MSetTemplates).
tags: [settings]
---
- runFlow: ../_subflows/launch.yaml
- openLink: generatorai:///settings
- extendedWaitUntil: {visible: {id: settings-server-card}, timeout: 20000}
- assertVisible: {id: settings-group-app}
- tapOn: {id: settings-search}
- inputText: dark
- extendedWaitUntil: {visible: {id: settings-result-appearance}, timeout: 5000}
- tapOn: {id: settings-result-appearance}
- extendedWaitUntil: {visible: {id: appearance-mode}, timeout: 10000}
- back
- openLink: generatorai:///settings/general
- extendedWaitUntil: {visible: {id: general-default-model}, timeout: 15000}
- tapOn: {id: general-default-model}
- extendedWaitUntil: {visible: {id: default-model-sheet}, timeout: 15000}
- tapOn: "Done"
- openLink: generatorai:///settings/providers
- extendedWaitUntil: {visible: {id: providers-test-all}, timeout: 20000}
- tapOn: {id: providers-test-all}
- extendedWaitUntil: {visible: {id: providers-message}, timeout: 60000}
- openLink: generatorai:///settings/skills
- extendedWaitUntil: {visible: {id: settings-skills-search}, timeout: 15000}
- openLink: generatorai:///settings/templates
- extendedWaitUntil: {visible: {id: settings-templates-search}, timeout: 15000}
- openLink: generatorai:///settings/mcp
- extendedWaitUntil: {visible: {id: settings-mcp-screen}, timeout: 15000}
- runFlow:
    when: {visible: "Add server"}
    commands:
      - tapOn: "Add server"
      - extendedWaitUntil: {visible: {id: mcp-add-name}, timeout: 10000}
      - tapOn: "Cancel"
