appId: ${APP_ID}
name: settings · theme and mode persist
tags: [characterization, full]
# Legacy rows omit accessibility selected; inspect the real provider (MD-103).
---
- runFlow: ../_subflows/launch.yaml
- tapOn: {id: menu-button}
- tapOn: {id: drawer-settings}
- tapOn: {id: settings-appearance}
- scrollUntilVisible: {element: {id: theme-option-solarized}, direction: DOWN}
- tapOn: {id: theme-option-solarized}
- scrollUntilVisible: {element: {id: mode-option-light}, direction: UP}
- tapOn: {id: mode-option-light}
- openLink: generatorai:///theme?inspect=1
- extendedWaitUntil: {visible: "Theme: solarized", timeout: 15000}
- assertVisible: "Mode: light"
- runFlow: ../_subflows/launch.yaml
- openLink: generatorai:///theme?inspect=1
- extendedWaitUntil: {visible: "Theme: solarized", timeout: 15000}
- assertVisible: "Mode: light"
- openLink: generatorai:///theme?theme=instrument&mode=system
- extendedWaitUntil: {visible: {id: menu-button}, timeout: 15000}
