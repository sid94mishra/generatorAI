<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>GeneratorAI — Problem</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px; text-align: center; }
      .badge { width: 56px; height: 56px; border-radius: 14px; background: #f8514922; color: #f85149; display: flex; align-items: center; justify-content: center; font-size: 28px; }
      h1 { font-size: 20px; font-weight: 650; }
      p { color: #8b949e; font-size: 14px; max-width: 560px; }
      pre { max-width: 640px; max-height: 220px; overflow: auto; text-align: left; background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 12px 14px; color: #ffa198; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge">!</div>
      <h1>GeneratorAI couldn't start</h1>
      <p>The local engine failed to start or the window couldn't load. Try restarting the app. If the problem persists, open the logs from the Server menu.</p>
      <pre id="msg"></pre>
    </div>
    <script>
      try {
        const params = new URLSearchParams(location.search);
        const msg = params.get('message') || 'Unknown error';
        document.getElementById('msg').textContent = decodeURIComponent(msg);
      } catch (e) {
        document.getElementById('msg').textContent = 'Unknown error';
      }
    </script>
  </body>
</html>
