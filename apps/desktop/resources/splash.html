<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;" />
    <title>GeneratorAI</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        border: 1px solid #21262d;
        border-radius: 12px;
        background:
          radial-gradient(900px 500px at 50% -10%, rgba(31, 111, 235, 0.18), transparent 60%),
          #0d1117;
      }
      .logo {
        width: 64px; height: 64px; border-radius: 16px;
        background: linear-gradient(135deg, #1f6feb, #4493f8);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 30px; color: #fff;
        box-shadow: 0 8px 30px rgba(31, 111, 235, 0.35);
      }
      .title { font-size: 19px; font-weight: 650; letter-spacing: 0.2px; }
      .subtitle { font-size: 13px; color: #8b949e; }
      .bar {
        margin-top: 6px; width: 220px; height: 4px; border-radius: 999px;
        background: #21262d; overflow: hidden; position: relative;
      }
      .bar::after {
        content: ""; position: absolute; inset: 0; width: 40%;
        background: linear-gradient(90deg, transparent, #4493f8, transparent);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">G</div>
      <div class="title">GeneratorAI</div>
      <div class="subtitle">Starting the local engine…</div>
      <div class="bar"></div>
    </div>
  </body>
</html>
